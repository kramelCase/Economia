# Fiches thématiques (/fr/theme/<clé>) : ce que chaque thème rassemble, nomenclature par nomenclature.
# Ces rattachements sont un REGROUPEMENT DU SITE : aucune table officielle ne relie une fonction COFOG à des missions du
# budget de l'État ou à des fonctions des départements. La fiche les affiche côte à côte, chacun avec sa source, et ne
# les additionne jamais. Ajouter un thème = ajouter une entrée ici (docs/ROADMAP.md, chantier C).
#
#   cofog    : code de la division COFOG (comptes nationaux, Eurostat)
#   missions : missions du budget de l'État, libellé publié dans le budget vert du PLF 2026 (crédits et dépenses fiscales)
#   m57      : code de la fonction des départements (nomenclature M57, OFGL)

