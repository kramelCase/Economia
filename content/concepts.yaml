# Lexique : chaque définition est une CITATION EXACTE d'un texte officiel, jamais une rédaction maison.
#
# Trois provenances possibles :
#   insee: <code>   -> page https://www.insee.fr/{fr,en}/metadonnees/definition/<code>, collectée par
#                      `make fetch` (raw/insee_definitions/), texte extrait automatiquement. FR et EN officiels.
#   releve: {...}   -> texte relevé à la main dans un navigateur quand le site bloque les robots
#                      (Légifrance). On garde l'URL, la date, la méthode et le texte exact.
#   (rien)          -> statut « a_sourcer » : le terme existe, la définition officielle reste à trouver.
#                      L'interface le dit au lieu d'inventer.
#
# Les agrégats OFGL (dépenses de fonctionnement, encours de dette...) sont ajoutés automatiquement
# depuis la source ofgl_definitions_agregats : ils ne figurent pas ici.
#
# alias : formes à relier automatiquement dans les textes de l'interface (la plus longue gagne).
# mesure : le poste publié que la définition citée nomme elle-même (utilisé par /verifier pour lire « déficit »).
# en (releve) : traduction NON officielle, signalée comme telle ; l'original français reste affiché.

concepts:
