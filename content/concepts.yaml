  # --- Loi organique relative aux lois de finances (LOLF), Légifrance ---
  - id: loi_de_finances
    terme: {fr: "Loi de finances", en: "Finance act"}
    alias:
      fr: ["loi de finances", "lois de finances"]
      en: ["finance act", "finance acts"]
    releve:
      url: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000044612392
      titre: "Loi organique n° 2001-692 du 1er août 2001 relative aux lois de finances, article 1er (version en vigueur au 26/10/2026)"
      date: "2026-10-26"
      methode: "Texte relevé dans un navigateur (Légifrance refuse les téléchargements automatiques, HTTP 403)."
      fr: "Dans les conditions et sous les réserves prévues par la présente loi organique, les lois de finances déterminent, pour un exercice, la nature, le montant et l'affectation des ressources et des charges de l'Etat, ainsi que l'équilibre budgétaire et financier qui en résulte. Elles tiennent compte d'un équilibre économique défini, ainsi que des objectifs et des résultats des programmes qu'elles déterminent."
      en: "Under the conditions and subject to the reservations laid down in this organic law, finance acts determine, for a financial year, the nature, amount and allocation of the State's resources and expenditure, as well as the resulting budgetary and financial balance. They take into account a defined economic balance, as well as the objectives and results of the programmes they determine."

  - id: mission
    terme: {fr: "Mission (budget de l'État)", en: "Mission (State budget)"}
    alias:
      fr: ["mission", "missions"]
      en: ["mission", "missions"]
    releve:
      url: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000006321025
      titre: "LOLF, article 7, I (extrait, version en vigueur au 26/10/2026)"
      date: "2026-10-26"
      methode: "Texte relevé dans un navigateur (Légifrance refuse les téléchargements automatiques, HTTP 403)."
      fr: "Les crédits ouverts par les lois de finances pour couvrir chacune des charges budgétaires de l'Etat sont regroupés par mission relevant d'un ou plusieurs services d'un ou plusieurs ministères. Une mission comprend un ensemble de programmes concourant à une politique publique définie."
      en: "Appropriations opened by finance acts to cover each of the State's budgetary charges are grouped by mission under one or more departments of one or more ministries. A mission comprises a set of programmes contributing to a defined public policy."

  - id: programme
    terme: {fr: "Programme (budget de l'État)", en: "Programme (State budget)"}
    alias:
      fr: ["programme", "programmes"]
      en: ["programme", "programmes"]
    releve:
      url: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000006321025
      titre: "LOLF, article 7, I (extrait, version en vigueur au 26/10/2026)"
      date: "2026-10-26"
      methode: "Texte relevé dans un navigateur (Légifrance refuse les téléchargements automatiques, HTTP 403)."
      fr: "Un programme regroupe les crédits destinés à mettre en oeuvre une action ou un ensemble cohérent d'actions relevant d'un même ministère et auquel sont associés des objectifs précis, définis en fonction de finalités d'intérêt général, ainsi que des résultats attendus et faisant l'objet d'une évaluation."
      en: "A programme groups the appropriations intended to implement an action or a coherent set of actions under the same ministry, with which precise objectives are associated, defined according to purposes of general interest, as well as expected results subject to evaluation."

  - id: ae
    terme: {fr: "Autorisation d'engagement (AE)", en: "Commitment authorisation (AE)"}
    alias:
      fr: ["autorisations d'engagement", "autorisation d'engagement", "AE"]
      en: ["commitment authorisations", "commitment authorisation"]
    releve:
      url: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000006321027
      titre: "LOLF, article 8 (extrait, version en vigueur au 26/10/2026)"
      date: "2026-10-26"
      methode: "Texte relevé dans un navigateur (Légifrance refuse les téléchargements automatiques, HTTP 403)."
      fr: "Les crédits ouverts sont constitués d'autorisations d'engagement et de crédits de paiement. Les autorisations d'engagement constituent la limite supérieure des dépenses pouvant être engagées."
      en: "Opened appropriations consist of commitment authorisations and payment appropriations. Commitment authorisations are the upper limit of expenditure that may be committed."

  - id: cp
    terme: {fr: "Crédit de paiement (CP)", en: "Payment appropriation (CP)"}
    alias:
      fr: ["crédits de paiement", "crédit de paiement", "CP"]
      en: ["payment appropriations", "payment appropriation"]
    releve:
      url: https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000006321027
      titre: "LOLF, article 8 (extrait, version en vigueur au 26/10/2026)"
      date: "2026-10-26"
      methode: "Texte relevé dans un navigateur (Légifrance refuse les téléchargements automatiques, HTTP 403)."
      fr: "Les crédits de paiement constituent la limite supérieure des dépenses pouvant être ordonnancées ou payées pendant l'année pour la couverture des engagements contractés dans le cadre des autorisations d'engagement."
      en: "Payment appropriations are the upper limit of expenditure that may be authorised or paid during the year to cover commitments entered into under commitment authorisations."

