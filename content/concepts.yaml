  - id: apu
    insee: c1244
    terme: {fr: "Administrations publiques (APU)", en: "General government"}
    alias:
      fr: ["administrations publiques", "APU"]
      en: ["general government"]

  - id: apul
    insee: c1540
    terme: {fr: "Administrations publiques locales (APUL)", en: "Local government"}
