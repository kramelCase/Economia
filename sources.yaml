# Catalogue des sources officielles. Chaque entrée = un jeu de données brut, collecté tel quel.
# Ajouter une source ici, puis `make fetch` et `make profile` : le modèle se déduit des profils.
#
# type: ods      -> API Opendatasoft explore v2.1 (export CSV intégral, `where` optionnel)
# type: http_csv -> URL CSV directe
#
# perimetre: ce que le chiffre couvre (affiché à côté de chaque montant dans l'interface).
# referentiel: le cadre comptable dans lequel la source publie (obligatoire pour une source qui porte des montants) :
#   comptes_nationaux -> comptabilité nationale (SEC 2010), Eurostat et Insee
#   budget_etat       -> comptabilité budgétaire de l'État (LOLF) : crédits votés et consommés
#   comptes_locaux    -> comptes de gestion des collectivités locales (instructions budgétaires M52, M57...), OFGL

sources:
  - id: etat_budget_vert_plf2026
    titre: "PLF 2026 - Budget vert"
    editeur: "DB"
    type: ods
    portail: https://data.economie.gouv.fr
    dataset: plf-2026-budget-vert
    licence: "Licence Ouverte v2.0 (Etalab)"
    perimetre: "Budget de l'État : crédits budgétaires, dépenses fiscales et taxes affectées (exécution 2024, LFI 2025, PLF 2026)"
    referentiel: budget_etat
    document_reference: "Rapport sur l'impact environnemental du budget de l'État, annexe au PLF 2026"

  - id: etat_plf2025_destination
    titre: "PLF 2025 - Dépenses 2025 selon destination"
    editeur: "DB"
    type: ods
    portail: https://data.economie.gouv.fr
    dataset: plf25-depenses-2025-selon-destination
    licence: "Licence Ouverte v2.0 (Etalab)"
    perimetre: "Budget de l'État : crédits prévus au PLF 2025 (AE/CP) par mission, programme, action, sous-action"
    referentiel: budget_etat
    document_reference: "Projet de loi de finances pour 2025, projets annuels de performances"

  - id: etat_depenses_fiscales_plf2024
    titre: "PLF 2024 - Voies et moyens tome II - Dépenses fiscales"
    editeur: "DB"
    type: ods
    portail: https://data.economie.gouv.fr
    dataset: plf-2024-vm-tome-2_depenses-fiscales
    licence: "Licence Ouverte v2.0 (Etalab)"
    perimetre: "Dépenses fiscales de l'État recensées au PLF 2024"
    referentiel: budget_etat
    document_reference: "Évaluation des voies et moyens, tome II, annexe au PLF 2024"

  - id: eurostat_cofog_fr
    annexes:
      copyright.html: https://ec.europa.eu/eurostat/web/main/help/copyright-notice
    page: https://ec.europa.eu/eurostat/cache/metadata/en/gov_10a_exp_esms.htm
    titre: "Dépenses des administrations publiques par fonction (COFOG) - France"
    editeur: "Eurostat"
    type: http_csv
    url: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/gov_10a_exp/A.MIO_EUR+PC_TOT+PC_GDP.S13+S1311+S1313+S1314..TE.FR?format=SDMX-CSV&startPeriod=1995"
    licence: "Réutilisation libre avec mention de la source (politique de copyright Eurostat)"
    perimetre: "Toutes les administrations publiques (S13) et sous-secteurs : centrales (S1311), locales (S1313), sécurité sociale (S1314)"
    referentiel: comptes_nationaux
    document_reference: "INSEE, Comptes nationaux annuels base 2020 - Dépenses des administrations publiques ventilées par fonction"

