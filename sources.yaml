  # Versions « consolidées » : budget principal + budgets annexes, flux internes retirés par l'OFGL.
  # C'est le chiffre officiel « combien dépense ma collectivité » sans double compte.
  - id: ofgl_regions
    titre: "Comptes consolidés des régions 2012-2025"
