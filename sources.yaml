    perimetre: "Régions et collectivités territoriales uniques : agrégats financiers consolidés (budget principal + annexes)"
    referentiel: comptes_locaux
    document_reference: "OFGL, Méthodologie - définitions et formules des agrégats financiers"

  - id: ofgl_departements
    titre: "Comptes consolidés des départements 2012-2025"
